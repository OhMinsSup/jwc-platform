# PR과 main 푸시마다 로컬과 같은 전체 검증(pnpm verify)과 웹 빌드를 돌린다.
# 비밀값은 쓰지 않는다 (배포는 이 워크플로의 범위가 아니다).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json의 packageManager를 따른다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 전체 검증 (포맷/린트, 의존성 버전, 미사용 코드, 타입, 테스트)
        run: pnpm verify

      - name: 웹 빌드
        run: pnpm -C apps/web build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Playwright Chromium 설치
        run: pnpm -C apps/web test:e2e:install

      # test:e2e도 with-env를 통해 로컬과 같은 공개 더미 설정을 주입한다.
      - name: 공개 신청 및 관리자 인증 E2E
        run: pnpm -C apps/web test:e2e

      - name: 실패 시 trace 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
