# PR과 main 푸시마다 로컬과 같은 전체 검증(pnpm verify)과 웹 빌드를 돌린다.
# 비밀값은 쓰지 않는다 (배포는 이 워크플로의 범위가 아니다).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json의 packageManager를 따른다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 전체 검증 (포맷/린트, 의존성 버전, 미사용 코드, 타입, 테스트)
        run: pnpm verify

      - name: 웹 빌드
        run: pnpm -C apps/web build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Playwright Chromium 설치
        run: pnpm -C apps/web exec playwright install --with-deps --only-shell chromium

      # 비밀값이 아닌 더미 값만 쓴다: 응답은 메모리 저장소, SMS는 로그 모드라 Google/SMS로 나가지 않는다.
      # DATA_KEY는 형식(base64 32바이트)만 맞춘 0 바이트 키다.
      - name: E2E용 로컬 환경 파일
        working-directory: apps/web
        run: |
          cat > .env <<'ENV'
          SITE_URL=http://localhost:5179
          BETTER_AUTH_SECRET=e2e-only-not-a-secret-0123456789abcdef
          ADMIN_EMAILS=e2e@example.com
          DATA_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          GOOGLE_SERVICE_ACCOUNT_EMAIL=e2e@example.com
          GOOGLE_PRIVATE_KEY=unused-in-memory-store
          GOOGLE_SPREADSHEET_ID=unused-in-memory-store
          SUBMISSION_STORE=memory
          SMS_MODE=log
          ENV

      - name: 공개 신청 E2E
        run: pnpm -C apps/web test:e2e

      - name: 실패 시 trace 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
